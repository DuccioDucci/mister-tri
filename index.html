const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),enc=a=>btoa(String.fromCharCode(...a));
async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},k,512));}
async function unlock(raw){
  const k=await crypto.subtle.importKey('raw',raw.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
  const h=await crypto.subtle.importKey('raw',raw.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  const iv=b64(P.i),ct=b64(P.c),d=new Uint8Array(iv.length+ct.length);d.set(iv);d.set(ct,iv.length);
